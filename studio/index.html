/* Layout: workshop app — library | live 3D stage | properties; tabs for cutting and parts. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --brand: #4caf72; --brand-ink: #08130c; --bar: #0b1d11; --bar-ink: #dcebe0; --gold: #d9a63a; --gold-soft: #2e2611;
  --err: #f08a8a; --err-soft: #2e1616; --warn: #e9b860; --warn-soft: #2b2312; --stage: #121915; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1411; --panel: #161d18; --panel2: #1b241e; --ink: #e6ebe4; --muted: #a2aa9e; --line: #2a352d;
  --brand: #4caf72; --brand-ink: #08130c; --bar: #0b1d11; --bar-ink: #dcebe0; --gold: #d9a63a; --gold-soft: #2e2611;
  --err: #f08a8a; --err-soft: #2e1616; --warn: #e9b860; --warn-soft: #2b2312; --stage: #121915; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; direction: rtl; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num, .stats b, .kpis b { font-variant-numeric: tabular-nums; }

/* top bar */
.bar { flex: none; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--bar); color: var(--bar-ink); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: #d9a63a; color: #123f23; display: grid; place-items: center; font-weight: 700; }
.brand .studio { color: #d9a63a; }
.proj { background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; color: var(--bar-ink); min-width: 0; width: 180px; }
.proj:hover, .proj:focus { border-color: rgba(255,255,255,.25); }
.tabs { display: flex; gap: 2px; background: rgba(255,255,255,.07); border-radius: 10px; padding: 3px; margin-inline-start: auto; }
.tabs button { border: 0; background: transparent; color: var(--bar-ink); padding: 0 14px; height: 38px; border-radius: 8px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: #d9a63a; color: #123f23; font-weight: 700; }
.ghost { display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: var(--bar-ink); height: 38px; padding: 0 12px; border-radius: 9px; }

#views { flex: 1; min-height: 0; position: relative; overflow: hidden; }

/* design view */
.design { display: grid; grid-template-columns: 1fr 340px; }
.stage { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--stage); }

.e { background: var(--err-soft); color: var(--err); }

.libbtn { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: var(--brand); color: var(--brand-ink); width: 70px; height: 54px; border-radius: 12px; font-size: 12px; font-weight: 600; }

.card .sw { display: flex; gap: 3px; }
.card .sw i { width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(0,0,0,.15); }

.danger { color: var(--err); }

.mats { display: flex; flex-direction: column; gap: 6px; }
.mrow { display: flex; align-items: center; gap: 10px; text-align: right; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 6px 10px; min-height: 48px; }

.pop { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,12,.45); display: grid; place-items: center; padding: 16px; }

.cut, .parts { overflow: auto; padding: 18px 16px 40px; }

.mg-h h3 { margin: 0; font-size: 15px; margin-inline-end: auto; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.pill.soft { background: var(--panel2); color: var(--muted); font-weight: 500; }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.bad { background: var(--err-soft); color: var(--err); }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.sheet { margin: 0; background: var(--panel2); border-radius: 12px; padding: 8px 10px; min-width: 0; }

.sheet figcaption b { color: var(--ink); }

@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.pcols { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
.pmain { min-width: 0; }

.projbtn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sec-ed { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; }

/* shop tab */
.shopgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btnrow { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin: 8px 0; }

/* workshop */
.wk-list { display: flex; flex-direction: column; gap: 6px; }
.wk-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; text-align: right; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; min-height: 56px; }

.wk-piece { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin-bottom: 10px; }
.kv span { color: var(--muted); }
.wk-dia { background: #fff; border-radius: 10px; padding: 8px; display: grid; place-items: center; }
.wk-dia svg { max-width: 100%; height: auto; }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.stage-b.cur { border: 2px solid var(--gold); }
@media (max-width: 900px) {
  .shopgrid { grid-template-columns: 1fr; }
  .client { grid-template-columns: 1fr; grid-template-rows: 55% 1fr; }
  .cl-side { border-inline-start: 0; border-top: 1px solid var(--line); }

}
@media (max-width: 560px) { .stages { grid-template-columns: repeat(2, 1fr); } .wk-row { grid-template-columns: 1fr auto; } .wk-row .stg { grid-column: 1 / -1; } }

/* narrow screens (iPad portrait / phone) */
@media (max-width: 900px) {

<script>
if ("serviceWorker" in navigator) {
  // look for a new version on every open and whenever the app comes back to the screen; reload once it is in
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => {
    r.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") r.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
