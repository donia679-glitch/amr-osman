<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>NOVERA Kitchen Studio — promo stage</title>
<style>
@font-face { font-family: Plex; src: url(fonts/IBMPlexSansArabic-Regular.ttf); font-weight: 400; }
@font-face { font-family: Plex; src: url(fonts/IBMPlexSansArabic-Medium.ttf); font-weight: 500; }
@font-face { font-family: Plex; src: url(fonts/IBMPlexSansArabic-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Plex; src: url(fonts/IBMPlexSansArabic-Bold.ttf); font-weight: 700; }
:root { --forest: #0f2e1c; --forest2: #17402a; --brass: #d2ad5b; --brass2: #b98d34; --ivory: #f2f3ee; --muted: #b9c4bb; --profile: #1b1d1c; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--forest); }
body { font-family: Plex, sans-serif; color: var(--ivory); }
#stage { position: absolute; inset: 0; overflow: hidden; background:
  repeating-linear-gradient(0deg, rgba(210,173,91,.045) 0 1px, transparent 1px 60px),
  repeating-linear-gradient(90deg, rgba(210,173,91,.045) 0 1px, transparent 1px 60px),
  radial-gradient(120% 90% at 70% 30%, #17402a 0%, #0f2e1c 55%, #0a2114 100%); }
.layer { position: absolute; inset: 0; will-change: transform, opacity; }
.center { display: grid; place-items: center; text-align: center; }
.big { font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.brass { color: var(--brass); }
.muted { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 14px; font-weight: 600; color: var(--brass); }
.tag i { display: inline-block; width: 46px; height: 6px; background: var(--brass); }
.device { position: absolute; background: #121413; border-radius: 34px; padding: 18px; box-shadow: 0 50px 90px -40px rgba(0,0,0,.85), 0 0 0 2px rgba(255,255,255,.06) inset; }
.device .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 16px; background: #eee; }
.device .screen img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.full img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; }
.handle { position: absolute; height: 10px; background: var(--profile); }
.handle::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--brass2); }
.prog { position: absolute; bottom: 0; right: 0; height: 6px; background: var(--brass2); opacity: .9; }
.bug { position: absolute; display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .14em; direction: ltr; }
.bug svg { width: 38px; height: 38px; }
ul.bul { list-style: none; padding: 0; display: grid; gap: 16px; }
ul.bul li { display: grid; grid-template-columns: 26px 1fr; gap: 14px; align-items: start; }
ul.bul li::before { content: ""; width: 20px; height: 8px; background: var(--brass); margin-top: .55em; }
.grid6 { position: absolute; display: grid; gap: 14px; }
.grid6 div { background: #121413; border-radius: 14px; padding: 7px; overflow: hidden; }
.grid6 img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.badge { display: inline-flex; align-items: center; gap: 14px; background: #000; color: #fff; border: 2px solid rgba(255,255,255,.3); border-radius: 16px; padding: 14px 28px; direction: ltr; }
.badge svg { width: 40px; height: 40px; }
.badge span { display: grid; text-align: left; line-height: 1.15; }
.badge small { font-size: 18px; opacity: .8; }
.badge b { font-size: 32px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="script.js"></script>
<script>
// ---------------------------------------------------------------- timeline (seconds)
const V = new URLSearchParams(location.search).get("v") === "1";   // vertical 1080×1920
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const MARK = '<svg viewBox="0 0 40 40"><rect width="40" height="40" rx="3" fill="#17402a"/><rect x="9" y="9" width="7" height="22" fill="#e9d9b0"/><rect x="24" y="9" width="7" height="22" fill="#e9d9b0"/><path d="M16 9h3l5 22h-3z" fill="#b98d34"/><rect x="6" y="33" width="28" height="2" fill="#b98d34"/></svg>';
const APPLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9a4.8 4.8 0 0 0-3.8-2c-1.6-.2-3.1.9-3.9.9s-2-.9-3.4-.9a5 5 0 0 0-4.2 2.6c-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6s1.7-.8 3.3-.8 2 .8 3.4.8 2.2-1.3 3-2.5a10.6 10.6 0 0 0 1.4-2.8 4.4 4.4 0 0 1-2.4-4.2ZM13.9 5a4.3 4.3 0 0 0 1-3.2 4.5 4.5 0 0 0-2.9 1.5 4.2 4.2 0 0 0-1 3.1 3.7 3.7 0 0 0 2.9-1.4Z"/></svg>';
const S = window.SCRIPT;  // filled by script.js
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
let starts = [], total = 0;
for (const sc of S.scenes) { starts.push(total); total += sc.dur; }
window.TOTAL = total;
const imgs = {};
function preload(list) { return Promise.all(list.map((src) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = () => res(); i.src = src; imgs[src] = i; }))); }
const all = new Set();
for (const sc of S.scenes) { for (const m of sc.media || []) { if (m.src) all.add(m.src); if (m.seq) for (let i = 0; i < m.count; i++) all.add(m.seq.replace("%03d", String(i).padStart(3, "0"))); } for (const g of sc.grid || []) all.add(g); }
window.READY = preload([...all]).then(() => document.fonts.ready);

// ---------------------------------------------------------------- pieces
const fs = (h, v) => (V ? v : h);   // font size per format
function bug(op = 1) { return `<div class="bug" style="top:${fs(44, 70)}px;left:${fs(56, 54)}px;opacity:${op};font-size:${fs(24, 30)}px">${MARK}<span>NOVERA</span></div>`; }
function device(m, x, y, w, k, extra = "") {
  // m.focus = [[x, y, w, h] at start, [x, y, w, h] at end] in screenshot pixels; k = 0..1 progress
  const iw = m.iw || 1366, ih = m.ih || 1024, sw = w - 36, sh = sw * (m.ratio || ih / iw), h = sh + 36;
  const f0 = m.focus?.[0] || [0, 0, iw, ih], f1 = m.focus?.[1] || f0, e = ease(k);
  const fx = lerp(f0[0], f1[0], e), fy = lerp(f0[1], f1[1], e), fw = lerp(f0[2], f1[2], e);
  const sc = sw / fw;
  const tx = -fx * sc, ty = Math.min(0, Math.max(-(ih * sc - sh), -fy * sc));
  return `<div class="device" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${m.phone ? "border-radius:54px;padding:16px;" : ""}${extra}"><div class="screen"><img src="${m.src}" style="width:${iw}px;height:${ih}px;transform:translate(${tx}px,${ty}px) scale(${sc})"></div></div>`;
}
function handleWipe(p, y) {   // the aluminium handle line sweeping across
  const w = W * out(p);
  return `<div class="handle" style="top:${y}px;right:0;width:${w}px"></div>`;
}

// ---------------------------------------------------------------- scenes
const R = {
  hook(sc, t) {
    let h = "";
    const lines = sc.lines;
    lines.forEach((ln, i) => {
      const a = seg(t, ln.at, ln.at + .5), gone = seg(t, sc.clear, sc.clear + .4);
      if (a <= 0) return;
      const y = (V ? 640 : 300) + i * fs(130, 160);
      h += `<div class="layer center" style="opacity:${a * (1 - gone)};transform:translateY(${y - H / 2 + (1 - out(a)) * 30}px)"><div class="big ${ln.cls || ""}" style="font-size:${fs(ln.size || 92, ln.size ? ln.size * 1.05 : 96)}px;max-width:${W - 140}px">${ln.text}</div></div>`;
    });
    const k = seg(t, sc.clear + .3, sc.dur);
    if (k > 0) h += `<div class="layer center" style="opacity:${out(k)}"><div class="big" style="font-size:${fs(78, 84)}px;max-width:${W - 160}px">${sc.after}</div></div>` + handleWipe(seg(t, sc.clear + .5, sc.dur), H / 2 + fs(90, 140));
    return h;
  },
  problem(sc, t) {
    let h = "";
    // 1) the problem, alone on the dark stage
    const pIn = seg(t, .1, .7), pOut = seg(t, sc.pdur - .35, sc.pdur);
    if (t < sc.pdur + .1) {
      h += `<div class="layer center" style="opacity:${pIn * (1 - pOut)}"><div style="display:grid;gap:${fs(26, 34)}px;justify-items:center;transform:translateY(${(1 - out(pIn)) * 24}px) scale(${1 + .03 * seg(t, 0, sc.pdur)})">
        <span class="tag" style="font-size:${fs(30, 36)}px"><i></i>${S.labels.problem} ${sc.n}</span>
        <div class="big" style="font-size:${fs(96, 92)}px;max-width:${fs(1500, 960)}px">${sc.problem}</div></div></div>`;
      h += handleWipe(seg(t, sc.pdur - .55, sc.pdur + .1), fs(H / 2 + 150, H / 2 + 260));
    }
    // 2) the answer: text + the real screen
    const s = t - sc.pdur; if (s < 0) return h;
    const k = seg(s, 0, sc.dur - sc.pdur), a = seg(s, 0, .6);
    const media = sc.media, mi = media.length > 1 ? Math.min(media.length - 1, Math.floor(seg(s, 0, sc.dur - sc.pdur) * media.length)) : 0;
    if (sc.full) {
      // full-bleed footage (the 3D orbit), text over a gradient
      // keyframes of the camera move, cross-blended so the move stays smooth
      const m = media[0], n = m.count, f = k * (n - 1), i0 = Math.min(n - 1, Math.floor(f)), i1 = Math.min(n - 1, i0 + 1), w = f - i0;
      const src = (i) => m.seq.replace("%03d", String(i).padStart(3, "0"));
      const zs = `transform:scale(${1.04 - .04 * k})`;
      h += `<div class="layer full" style="opacity:${a}"><img src="${src(i0)}" style="${zs}"><img src="${src(i1)}" style="${zs};opacity:${w}"></div>`;
      h += `<div class="shade" style="background:${V ? "linear-gradient(to top, rgba(10,33,20,.96) 0%, rgba(10,33,20,.8) 38%, transparent 62%)" : "linear-gradient(to left, rgba(10,33,20,.95) 0%, rgba(10,33,20,.75) 34%, transparent 60%)"};opacity:${a}"></div>`;
    } else {
      const m = media[mi], km = media.length > 1 ? (seg(s, 0, sc.dur - sc.pdur) * media.length) % 1 : k;
      const dw = m.phone ? fs(470, 520) : fs(1060, 960), dx = m.phone ? fs(90 + (1060 - 470) / 2, (1080 - 520) / 2) : fs(90, 60), dy = m.phone ? fs(70, 760) : fs(150, 860);
      const enter = out(a);
      h += device(m, dx, dy + (1 - enter) * 60, dw, km, `opacity:${enter}`);
    }
    // text block
    const tw = fs(sc.full ? 760 : 640, 940), tx = fs(80, 70), ty = fs(sc.full ? 300 : 250, sc.full ? 1180 : 210);
    const b = (i) => seg(s, .5 + i * .45, 1 + i * .45);
    h += `<div class="layer" style="right:${tx}px;left:auto;top:${ty}px;width:${tw}px;height:auto;opacity:${a};transform:translateY(${(1 - out(a)) * 26}px)">
      <span class="tag" style="font-size:${fs(26, 32)}px"><i></i>${S.labels.solution}</span>
      <div class="big" style="font-size:${fs(72, 76)}px;margin:${fs(18, 20)}px 0 ${fs(22, 26)}px">${sc.title}</div>
      <ul class="bul" style="font-size:${fs(34, 38)}px;line-height:1.5">${sc.bullets.map((x, i) => `<li style="opacity:${b(i)};transform:translateX(${-(1 - out(b(i))) * -20}px)">${x}</li>`).join("")}</ul></div>`;
    return h;
  },
  finale(sc, t) {
    let h = "";
    // 1) every screen together
    const g = sc.grid, cols = V ? 2 : 3, rows = Math.ceil(g.length / cols);
    const gw = fs(1640, 960), gh = gw / cols * .75 * rows + 14 * (rows - 1);
    const gIn = seg(t, 0, .9), gOut = seg(t, 3.6, 4.4);
    if (t < 4.5) {
      h += `<div class="grid6" style="left:${(W - gw) / 2}px;top:${(H - gh) / 2 + fs(40, 0)}px;width:${gw}px;grid-template-columns:repeat(${cols},1fr);opacity:${gIn * (1 - gOut)};transform:scale(${1.08 - .08 * out(gIn) - .1 * ease(gOut)})">` +
        g.map((src, i) => { const d = seg(t, i * .12, .5 + i * .12); return `<div style="aspect-ratio:4/3;opacity:${d};transform:translateY(${(1 - out(d)) * 40}px)"><img src="${src}"></div>`; }).join("") + "</div>";
      const c = seg(t, 1.3, 2);
      h += `<div class="layer center" style="opacity:${c * (1 - gOut)}"><div class="big" style="font-size:${fs(104, 82)}px;max-width:${W - 120}px;padding:${fs(24, 30)}px ${fs(56, 44)}px;background:rgba(10,33,20,.88);border-radius:8px;box-shadow:0 30px 80px -30px #000">${sc.line}</div></div>`;
    }
    // 2) the logo and the call to action
    const l = seg(t, 4.3, 5.1);
    if (l > 0) {
      const y = fs(0, 0);
      h += `<div class="layer center" style="opacity:${l}"><div style="display:grid;gap:${fs(26, 34)}px;justify-items:center;transform:translateY(${(1 - out(l)) * 30 + y}px)">
        <div style="width:${fs(130, 170)}px;height:${fs(130, 170)}px">${MARK.replace("<svg", '<svg style="width:100%;height:100%"')}</div>
        <div class="big" style="font-size:${fs(96, 96)}px;direction:ltr;letter-spacing:.01em">NOVERA <span class="brass">Kitchen Studio</span></div>
        <div class="muted" style="font-size:${fs(36, 40)}px;opacity:${seg(t, 5, 5.6)}">${sc.sub}</div>
        <div style="display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:${fs(14, 30)}px;opacity:${seg(t, 5.6, 6.2)}">
          <span class="badge">${APPLE}<span><small>${sc.soon}</small><b>App Store</b></span></span></div>
        <div class="brass" style="font-size:${fs(40, 44)}px;font-weight:600;opacity:${seg(t, 6.3, 6.9)}">${sc.trial}</div>
        <div class="muted" style="font-size:${fs(28, 32)}px;opacity:${seg(t, 7, 7.6)}">${sc.made}</div></div></div>`;
      h += handleWipe(seg(t, 4.6, 5.6), fs(H - 150, H - 260));
    }
    return h;
  },
};

window.renderAt = function (T) {
  let i = starts.length - 1;
  while (i > 0 && T < starts[i]) i--;
  const sc = S.scenes[i], t = T - starts[i];
  let h = R[sc.kind](sc, t);
  // fade between scenes
  const fin = seg(t, 0, .35), fout = 1 - seg(t, sc.dur - .35, sc.dur);
  const op = (i === 0 ? 1 : fin) * (i === S.scenes.length - 1 ? 1 - seg(T, total - .6, total) : fout);
  stage.innerHTML = `<div class="layer" style="opacity:${op}">${h}</div>` + (sc.kind !== "finale" ? bug(.9) : "") + `<div class="prog" style="width:${W * T / total}px"></div>`;
};
</script>
</body>
</html>
