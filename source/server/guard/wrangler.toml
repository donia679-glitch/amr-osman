# NOVERA Studio — «🛡 حماية المحركات» (Cloudflare Worker). Deploy: node sync.mjs && npx wrangler deploy
name = "novera-guard"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# copies the app's engine files into engines/ before every deploy / dev run (needs Node 18+)
[build]
command = "node sync.mjs"

[vars]
BUNDLE_ID = "com.novera.studio"
PRODUCT_IDS = "novera.studio.monthly,novera.studio.yearly"
# "Production" only once the app is on the store; add Sandbox while testing with TestFlight / sandbox accounts
APPLE_ENVIRONMENTS = "Production,Sandbox"
RATE_PER_MIN = "60"
MAX_ENGINE_MS = "8000"
ALLOWED_ORIGINS = ""
REVOKED = ""

# Secrets — never here. Run once each (it asks for the value):
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put LICENSE_SECRET
#   npx wrangler secret put ADMIN_KEY        (optional: lets you make licence keys from the app / curl)

# Paid plan only — more CPU per request for the heavy engines (cutfitSearch / autogenRank):
# [limits]
# cpu_ms = 30000

# Optional hard rate limit (Cloudflare "Rate Limiting" binding — check that your plan has it):
# [[unsafe.bindings]]
# name = "RL"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
