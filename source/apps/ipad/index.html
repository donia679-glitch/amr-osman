/* cut + parts */

.mg-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

.mg-h h3 { margin: 0; font-size: 15px; margin-inline-end: auto; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.pill.soft { background: var(--panel2); color: var(--muted); font-weight: 500; }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.bad { background: var(--err-soft); color: var(--err); }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.sheet { margin: 0; background: var(--panel2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.sheet figcaption { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.sheet figcaption b { color: var(--ink); }
.sheet svg { width: 100%; height: auto; display: block; direction: ltr; }
.sheet .sh { fill: var(--panel); stroke: var(--ink); stroke-width: .6; }
.sheet .off { fill: var(--line); stroke: var(--muted); stroke-width: .3; stroke-dasharray: 2 1.5; }
.sheet .pc { stroke: var(--bar); stroke-width: .5; fill-opacity: .85; }
.sheet text { fill: #10140f; font-family: var(--font); font-weight: 600; paint-order: stroke; stroke: rgba(255,255,255,.75); stroke-width: .7px; }
.sheet text .dim { font-weight: 400; }
.sheet details { border: 0; padding: 4px 0 0; font-size: 12.5px; }
.sheet ol { margin: 4px 0; padding-inline-start: 20px; line-height: 1.8; }

.busy { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 30px 0; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: sp 0.8s linear infinite; }

@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.pcols { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
.pmain { min-width: 0; }

.elevbox { margin: 8px 0; }
.elevbox > summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
.elevu { width: 100%; height: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }


/* projects, cloud state */

.steps { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }

@media (max-width: 900px) { .steps button span small { display: none; } }

@media (max-width: 640px) { .steps button span { display: none; } .steps button.on span { display: inline; } .steps { gap: 2px; padding: 5px 8px; } .steps i { width: 8px; } .steps button { padding: 0 8px; } }
#tour { position: fixed; inset: 0; z-index: 200; background: rgba(8, 20, 12, .45); }
#tour .tring { position: fixed; border-radius: 14px; box-shadow: 0 0 0 3px var(--gold, #d9a63a), 0 0 0 9999px rgba(8, 20, 12, .35); pointer-events: none; transition: all .25s; }
#tour .tcard { position: fixed; inset-inline: max(16px, calc(50% - 220px)); max-width: 440px; margin: 0 auto; background: var(--panel); color: var(--ink); border-radius: 18px; padding: 16px 18px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
#tour .tcard b { font-size: 17px; }

#tour .trow span { margin-inline-end: auto; color: var(--muted); font-size: 12.5px; }
.prodst { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.prodst > div { background: var(--panel2); border-radius: 12px; padding: 8px 10px; display: grid; gap: 2px; }
.prodst b { font-size: 20px; } .prodst span { color: var(--muted); font-size: 12.5px; }

.cfin { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cfin button { display: grid; justify-items: center; gap: 4px; padding: 8px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); color: var(--ink); font-weight: 700; font-size: 12.5px; }
.cfin button i { width: 46px; height: 46px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); }

.ctotal { font-size: 16px; margin: 10px 0 0; } .ctotal b { font-size: 20px; color: var(--brand); }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.undogrp { display: inline-flex; gap: 4px; }

.projbtn { display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--bar-ink); height: 38px; padding: 0 12px; border-radius: 9px; max-width: 240px; }

.plist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

/* dressing editor */

.comps { margin-top: 8px; }
.add.sm2 { height: 36px; font-size: 13px; }

.psum span { font-size: 12px; color: var(--muted); } .psum b { font-size: 22px; font-variant-numeric: tabular-nums; } .psum small { font-size: 11.5px; color: var(--muted); }

.pboards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.pboard { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pbh { display: flex; align-items: center; gap: 8px; } .pbh i { width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); flex: none; }
.pbh b { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .pbrow .pin, .pstep .tbl .pin { width: 100%; box-sizing: border-box; }
.gsize { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13px; }
.gsize input { width: 64px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); text-align: center; font: inherit; }
.gsize select { height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12.5px; padding: 0 6px; }
.mg-h .gsize { margin-inline-start: auto; }
.tbl tr.ptot td { font-weight: 800; border-top: 2px solid var(--line); }
@media (max-width: 640px) { .psum b { font-size: 18px; } .psum { gap: 6px; } }
/* v102: the quick cut list as a table */
.qcut { overflow: auto; padding: 18px 16px 40px; }
.qkpis { grid-template-columns: repeat(4, minmax(70px, 1fr)); margin: 0; min-width: 300px; }
.qwrap { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.qtab { min-width: 940px; }
